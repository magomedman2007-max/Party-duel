function series(f){const t=ser.kind==='tour';for(let p=0;p<2;p++)if(f===p)earn(p,t?40:15);else if(t)earn(p,10)}

function applySkin(){for(let p=0;p<2;p++){const s=SKN[skin[p]];C[p]=s.c||DEF[p];SKO[p]=s.k?mkp(s.k,s.d):null}if(C[0]===C[1])C[1]=DEF[C[0]===DEF[1]?0:1]}

let S=1,OX=0,OY=0,DPR=1,rot=false,pr=false;

const keys={},ptr=[null,null];let cur=null,phase='menu',paused=false,ser,tmr,cdT=0,cn=0,stats=[0,0];
